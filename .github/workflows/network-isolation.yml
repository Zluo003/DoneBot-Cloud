name: Node network isolation regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  networking:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUD_DONEBOT_IMAGE: ghcr.io/zluo003/donebot-cloud-service@sha256:bff0b6888023791b3ceddb90a7601d50d5ec2f90f8f85a6f6ffa531ba770d5c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Prepare disposable host
        run: |
          set -euo pipefail
          npm ci
          npm test
          sudo apt-get update -qq
          sudo apt-get install -y nftables
          docker pull "$CLOUD_DONEBOT_IMAGE"
      - name: Verify host rules and real two-user networking
        run: |
          set -euo pipefail
          sudo env PATH="$PATH" CLOUD_DISPOSABLE_LINUX=1 node scripts/verify-egress-host.mjs
          sudo env PATH="$PATH" CLOUD_DISPOSABLE_LINUX=1 CLOUD_DONEBOT_IMAGE="$CLOUD_DONEBOT_IMAGE" node scripts/verify-egress.mjs | tee "$RUNNER_TEMP/network-verification.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-network-verification
          path: ${{ runner.temp }}/network-verification.jsonl
          if-no-files-found: error
          retention-days: 14
