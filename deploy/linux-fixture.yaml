# Disposable validation VM; no host directories or application ports are shared.
minimumLimaVersion: 2.0.0
vmType: vz
arch: aarch64
images:
- location: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-arm64-20261103-2651.qcow2
  arch: aarch64
  digest: sha512:5d3ecec46fd29605db4084388a1e2eb82fd19a80202898f962840ea73793261de721e505e3877c829ae86c37fdd2f6c205b0b3b1337a89d0d4b98d9081adc0c2
cpus: 4
memory: 6GiB
disk: 30GiB
mounts: []
containerd:
  system: false
  user: false
portForwards:
- guestIP: 0.0.0.0
  guestIPMustBeZero: false
  proto: any
  ignore: true
provision:
- mode: system
  script: |
    #!/bin/bash
    set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y docker.io nftables iproute2 ca-certificates
    systemctl enable --now docker
